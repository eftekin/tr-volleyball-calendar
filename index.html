<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kadın Voleybol Maç Takvimi · Sultanlar Ligi Hangi Kanalda</title>
<meta name="description" content="Sultanlar Ligi ve Kupa Voley maçlarını saat ve TV kanalıyla (TRT Spor, TRT Spor Yıldız) Google Takvim'e ekle. Takımını ve kanalını seç, takvim kendiliğinden güncellensin.">
<link rel="canonical" href="https://voleybol-takvim.vercel.app/">
<meta property="og:type" content="website">
<meta property="og:locale" content="tr_TR">
<meta property="og:url" content="https://voleybol-takvim.vercel.app/">
<meta property="og:title" content="Kadın Voleybol Maç Takvimi">
<meta property="og:description" content="Sultanlar Ligi ve Kupa Voley maçlarını saat ve TV kanalıyla (TRT Spor, TRT Spor Yıldız) Google Takvim'e ekle. Takımını ve kanalını seç, takvim kendiliğinden güncellensin.">
<style>
  :root { --bg: #fff; --fg: #1a1a1a; --muted: #666; --line: #ddd; --accent: #1a5fb4; --pick: #e8f0fb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121212; --fg: #eee; --muted: #999; --line: #333; --accent: #78aeed; --pick: #1c2a3d; } }
  body { margin: 0 auto; max-width: 640px; padding: 24px 16px 48px; background: var(--bg); color: var(--fg);
         font: 17px/1.5 system-ui, sans-serif; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 28px 0 8px; }
  h2 small, .muted { color: var(--muted); font-weight: 400; }
  p { margin: 0 0 8px; }
  a { color: var(--accent); }
  fieldset { border: 0; margin: 0 0 16px; padding: 0; }
  legend { font-weight: 600; padding: 0; margin-bottom: 6px; }
  label { display: flex; gap: 8px; align-items: center; min-height: 44px; cursor: pointer; }
  input[type=checkbox] { width: 20px; height: 20px; margin: 0; flex-shrink: 0; accent-color: var(--accent); }
  .opts { display: flex; flex-wrap: wrap; column-gap: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .grid label { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; line-height: 1.25; }
  .grid label:has(:checked) { border-color: var(--accent); background: var(--pick); }
  .subs { display: grid; gap: 8px; }
  .subs a, .subs button { display: block; padding: 12px 14px; border: 1px solid var(--line); border-radius: 6px; font: inherit;
                          text-align: left; text-decoration: none; color: var(--fg); background: none; cursor: pointer; }
  .subs a:hover, .subs button:hover { border-color: var(--accent); }
  footer { margin-top: 32px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<h1>Kadın Voleybol Maç Takvimi</h1>
<p class="muted">Maçları seç, takvimine ekle. Saat ve kanal değişiklikleri kendiliğinden gelir.</p>

<div id="form"><p>Fikstür yükleniyor…</p></div>

<h2>Takvime ekle <small id="count"></small></h2>
<div class="subs">
  <a id="gcal" target="_blank" rel="noopener">Google Takvim</a>
  <a id="webcal">Apple Takvim</a>
  <a id="webcal2">Outlook</a>
  <a id="outlook" target="_blank" rel="noopener">Outlook.com</a>
  <button id="copy" type="button">Linki kopyala</button>
</div>

<footer>Veri: <a href="https://fikstur.tvf.org.tr">TVF</a> · <a href="https://github.com/eftekin/tr-volleyball-calendar">GitHub</a></footer>

<script>
const FEED = location.origin + "/kadin-voleybol.ics";
const groups = { lig: "Lig", kanal: "Kanal", takim: "Takım" };
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let matches = [], url = "";

function parse(ics) {
  const un = s => s.replace(/\\n/g, "\n").replace(/\\([,;\\])/g, "$1");
  return ics.split("BEGIN:VEVENT").slice(1).map(ev => {
    const get = k => un((ev.match(new RegExp("^" + k + ":(.*)$", "m")) || [, ""])[1].trim());
    const [lig, kanal] = get("DESCRIPTION").split("\nKanal: ");
    const [ev_sahibi, misafir] = get("SUMMARY").split(" - ");
    // tvf joins simulcasts: "TVF Voleybol TV-Tabii Spor"
    return { lig, kanal: kanal === "belli değil" ? [] : kanal.split("-").map(k => k.trim()), takim: [ev_sahibi, misafir] };
  });
}

function update() {
  const sel = {}, q = new URLSearchParams();
  for (const g in groups) sel[g] = [...document.querySelectorAll(`input[name=${g}]:checked`)].map(i => i.value);
  for (const g in sel) sel[g].forEach(v => q.append(g, v));
  if (![...q].length) q.append("lig", ""); // nothing picked = everything (bare link means trt-only)
  url = FEED + "?" + q;
  const n = matches.filter(m => (!sel.lig.length || sel.lig.includes(m.lig))
    && (!sel.kanal.length || m.kanal.some(k => sel.kanal.includes(k)))
    && (!sel.takim.length || m.takim.some(t => sel.takim.includes(t)))).length;
  document.getElementById("count").textContent = `· ${n} maç`;
  const webcal = url.replace(/^https?:/, "webcal:");
  document.getElementById("gcal").href = "https://calendar.google.com/calendar/r?cid=" + encodeURIComponent(webcal);
  // apple calendar and desktop outlook both handle webcal://
  document.getElementById("webcal").href = document.getElementById("webcal2").href = webcal;
  document.getElementById("outlook").href = "https://outlook.live.com/owa/?rru=addsubscription&name=" +
    encodeURIComponent("Kadın Voleybol") + "&url=" + encodeURIComponent(webcal);
}

fetch(FEED + "?lig=").then(r => { if (!r.ok) throw r.status; return r.text(); }).then(ics => {
  matches = parse(ics);
  const opts = { lig: matches.map(m => m.lig), kanal: matches.flatMap(m => m.kanal), takim: matches.flatMap(m => m.takim) };
  document.getElementById("form").innerHTML = Object.entries(groups).map(([g, title]) => {
    const vals = [...new Set(opts[g])].sort((a, b) => a.localeCompare(b, "tr"));
    return `<fieldset><legend>${title} <span class="muted">(boşsa hepsi)</span></legend><div class="${g === "takim" ? "grid" : "opts"}">` +
      vals.map(v => `<label><input type="checkbox" name="${g}" value="${esc(v)}">${esc(v)}</label>`).join("") +
      `</div></fieldset>`;
  }).join("");
  document.getElementById("form").addEventListener("change", update);
  update();
}).catch(() => { document.getElementById("form").innerHTML = "<p>Fikstür şu an alınamadı, biraz sonra tekrar dene.</p>"; });

document.getElementById("copy").onclick = e => navigator.clipboard.writeText(url)
  .then(() => { e.target.textContent = "Kopyalandı"; });
</script>
</body>
</html>
